name: Release Self-Test

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-fixtures:
    name: Release Fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Validate workflow and action YAML
        shell: bash
        run: |
          set -euo pipefail
          ruby -e 'require "yaml"; Dir[".github/**/*.yml"].sort.each { |path| YAML.load_file(path) }'
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Compile release scripts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/*.py

      - name: Run local release fixtures
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s .github/tests -p 'test_*.py' -v

      - name: Check patches for whitespace errors
        shell: bash
        run: |
          set -euo pipefail
          git diff --check HEAD^ HEAD
